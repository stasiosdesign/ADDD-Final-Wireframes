<main>

  <section class="pg-hero">
    <div class="container">
      <div class="pg-hero__grid">
        <div class="pg-hero__col">
          <p class="tagline">Enquire</p>
          <h1 class="h2">Send your enquiry</h1>
          <p class="text-md">Tell us what you need</p>
          <ul class="contact-list">
            <li><a href="mailto:allister@addd.io">allister@addd.io</a></li>
            <li><a href="tel:+15550000000">+1 (555) 000-0000</a></li>
            <li>123 Sample St, Sydney NSW 2000 AU</li>
          </ul>
        </div>

        <div class="pg-hero__col">
          <form class="form" style="width:100%" onsubmit="return false">
            <div class="form__row">
              <div class="field"><label for="fn">First name</label><input id="fn" type="text"></div>
              <div class="field"><label for="ln">Last name</label><input id="ln" type="text"></div>
            </div>
            <div class="form__row">
              <div class="field"><label for="em">Email address</label><input id="em" type="email"></div>
              <div class="field"><label for="ph">Phone number</label><input id="ph" type="tel"></div>
            </div>

            <div class="field">
              <label for="topic">What&rsquo;s your enquiry about?</label>
              <select id="topic">
                <option>Select an option</option>
                <option>Workshops &amp; Audits</option>
                <option>Technology Blueprint</option>
                <option>Advisory</option>
                <option>Reports and research</option>
                <option>Something else</option>
              </select>
            </div>

            <div class="field">
              <span>Your role at the practice</span>
              <div class="radio-grid">
                <label><input type="radio" name="role"> Director or partner</label>
                <label><input type="radio" name="role"> Technology lead</label>
                <label><input type="radio" name="role"> Practice manager</label>
                <label><input type="radio" name="role"> Operations or strategy</label>
                <label><input type="radio" name="role"> Senior architect</label>
                <label><input type="radio" name="role"> Other</label>
              </div>
            </div>

            <div class="field">
              <label for="msg">Message</label>
              <textarea id="msg" placeholder="Tell us more about your enquiry"></textarea>
            </div>

            <label class="checkbox"><input type="checkbox"> I agree to be contacted about my enquiry</label>

            <button class="btn btn--dark" type="submit" style="align-self:flex-start">Send enquiry</button>
          </form>
        </div>
      </div>
    </div>
  </section>

</main>
